name: Сборка .exe для Windows
on:
  # Сборку запускает публикация релиза на GitHub. Тег отдельно не слушаем:
  # релиз сам создаёт тег, и иначе одна версия собиралась бы дважды.
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        with: { name: Podpiski-Setup, path: release/*.exe }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: 'release/Podpiski*Setup.exe' }

  build-win7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Electron 22 — последняя версия с поддержкой Windows 7 (движок Chrome 108).
      - run: npm install --no-save electron@22.3.27
      - run: npm run build
        env: { VITE_TARGET: chrome108 }
      - shell: bash
        run: npx electron-builder --win --publish never --config.electronVersion=22.3.27 '--config.artifactName=Podpiski-Win7-Setup.${ext}'
      - uses: actions/upload-artifact@v4
        with: { name: Podpiski-Win7-Setup, path: release/*.exe }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: 'release/Podpiski*Setup.exe' }
